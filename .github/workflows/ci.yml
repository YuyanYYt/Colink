name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
      - run: uv sync --locked
      - run: uv run python scripts/check-publication.py
      - run: uv run ruff check src tests macos scripts/check-publication.py
      - run: uv run ruff format --check src tests macos scripts/check-publication.py
      - name: Test in an independent workspace directory
        run: |
          mkdir -p .artifacts
          colink_test_dir=$(mktemp -d .artifacts/ci-tests.XXXXXX)
          uv run pytest -q --basetemp "$colink_test_dir"
      - run: uv run colink demo
      - run: uv run colink demo-local
      - run: bash -n scripts/install-macos.sh
